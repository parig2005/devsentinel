# ===========================================================================
# DevSentinel — application configuration
#
# Every value below can be overridden by an environment variable.
# Copy .env.example to .env and set values there, or export them in your shell.
# NO REAL SECRETS BELONG IN THIS FILE.
# ===========================================================================

spring.application.name=DevSentinel
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database — DEFAULT: H2 file-based
#
# H2 is the default on purpose: it needs no installation, so the project runs
# on a fresh Windows laptop immediately. Data persists in ./data/devsentinel.mv.db
# between restarts, which is what you want when demonstrating that results are
# actually saved.
#
# To use PostgreSQL instead, run with:  --spring.profiles.active=postgres
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/devsentinel;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Browse the database at http://localhost:8080/h2-console during the demo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate creates/updates the tables automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# File upload limits (defence against oversized uploads)
# ---------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# ---------------------------------------------------------------------------
# Python AI service
# ---------------------------------------------------------------------------
devsentinel.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
devsentinel.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:3000}
devsentinel.ai.response-timeout-seconds=${AI_RESPONSE_TIMEOUT_SECONDS:20}
devsentinel.ai.max-retries=${AI_MAX_RETRIES:1}
# Max snippets sent to the AI service per analysed file (keeps demos fast)
devsentinel.ai.max-snippets=${AI_MAX_SNIPPETS:25}

# ---------------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Error handling — never leak stack traces to the browser
# ---------------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.devsentinel=INFO
logging.level.org.springframework.web=WARN
