# ===========================================================================
# PostgreSQL profile.  Activate with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Create the database first:
#   createdb devsentinel
# Optionally run db/schema.sql if you prefer explicit DDL over ddl-auto.
# ===========================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devsentinel}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# H2 console is meaningless here
spring.h2.console.enabled=false
